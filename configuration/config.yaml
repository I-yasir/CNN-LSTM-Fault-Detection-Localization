project:
  name: "FaultDetection-CNNLSTM"
  seed: 42

system:
  voltage_kv: 132
  frequency_hz: 60
  line_length_km: 300.0
  num_classes: 11
  input_channels: 6

paths:
  raw_data: "data/raw/dataset.h5"
  test_data: "data/raw/test_dataset.h5"
  snr_data: "data/raw/SNR_test.h5"
  resistance_data: "data/raw/resistance_test.h5"
  splits: "data/processed/dataset_splits.npz"
  norm_params: "data/processed/norm_params.json"
  model_save: "models/best_model.pth"
  reports_dir: "reports/"

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 30
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  loc_loss_weight: 0.01